name: Build Cutcord
on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - .github/workflows/build.yml
            - src/**
            - browser/**
            - scripts/**
            - package.json
            - pnpm-lock.yaml
            - pnpm-workspace.yaml
            - tsconfig.json
            - packages/**
            - patches/**
            - LICENSE
            - NOTICE

permissions:
    contents: write

concurrency:
    group: cutcord-devbuild
    cancel-in-progress: true

env:
    FORCE_COLOR: true
    VENCORD_REMOTE: ${{ github.repository }}

jobs:
    Build:
        if: github.repository == 'drainingwish/VencordFork'
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6

            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Check types
              run: pnpm testTsc

            - name: Build web
              run: pnpm buildWebStandalone

            - name: Build desktop
              run: pnpm buildStandalone

            - name: Generate plugin list
              run: pnpm generatePluginJson dist/plugins.json dist/plugin-readmes.json

            - name: Prepare release files
              run: |
                  rm -rf dist/*-unpacked dist/vendor
                  cp LICENSE NOTICE dist/
                  echo "RELEASE_HASH=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

            - name: Publish Cutcord DevBuild
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
              run: |
                  if gh release view devbuild >/dev/null 2>&1; then
                      gh api --method PATCH "repos/$GH_REPO/git/refs/tags/devbuild" -f sha="$GITHUB_SHA" -F force=true
                  else
                      gh release create devbuild --target "$GITHUB_SHA" --title "Cutcord DevBuild $RELEASE_HASH" --notes "Cutcord development build. Based on Vencord and Equicord; see LICENSE and NOTICE."
                  fi
                  gh release upload devbuild --clobber dist/*
                  gh release edit devbuild --title "Cutcord DevBuild $RELEASE_HASH" --latest
